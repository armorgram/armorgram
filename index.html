<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Armorgram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            obsidian: '#06030c',
            night: '#0d0718',
            surface: '#160d26',
            borderViolet: '#2d1a4d',
          },
          boxShadow: {
            armor: '0 18px 48px -12px rgba(139, 92, 246, 0.35)',
            armorSm: '0 8px 24px -6px rgba(139, 92, 246, 0.3)',
          },
        },
      },
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #06030c;
      color: #f5f3ff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .armor-gradient-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 55%, #c026d3 100%);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .armor-gradient-btn:hover {
      filter: brightness(1.08);
    }
    .armor-gradient-btn:active {
      transform: scale(0.97);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.25);
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-obsidian text-violet-50 min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[92%] max-w-sm pointer-events-none"></div>

  <script>
    // =========================================================================
    // 1. SABİTLER VE DURUM YÖNETİMİ
    // =========================================================================
    const STORAGE_KEY = 'armorgram_clean_state_v1';
    const SUPABASE_URL = 'https://zuigsqvjtgaudlqvgzdb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_w58_KL2tNI4hEwwBD4CWjg_bPx6k7PM';
    const AUTH_EMAIL_DOMAIN = 'armorgram.local';

    const defaultState = {
      profiles: [],
      searchResults: [],
      isSearching: false,
      follows: [],
      notifications: [],
      directMessages: [],
      sessionUserId: null,
      activeTab: 'messages', // 'messages' | 'search' | 'notifications' | 'profile'
      searchQuery: '',
      selectedChatUserId: null,
      viewedProfileUserId: null,
      editProfileOpen: false,
    };

    let state = JSON.parse(JSON.stringify(defaultState));
    let authMode = 'login';
    let sbClient = null;
    let realtimeSubscription = null;
    let activeRealtimeUserId = '';
    let typingChannel = null;
    let activeTypingPeerId = null;
    let peerIsTyping = false;
    let typingHideTimer = null;
    let typingBroadcastTimer = null;
    let searchDebounceTimer = null;

    // =========================================================================
    // 2. YARDIMCI FONKSİYONLAR
    // =========================================================================
    function showToast(message, type = 'info') {
      try {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const item = document.createElement('div');
        const badgeColor =
          type === 'error'
            ? 'border-rose-500/50 bg-rose-950/95 text-rose-100'
            : type === 'success'
            ? 'border-emerald-500/50 bg-emerald-950/95 text-emerald-100'
            : 'border-purple-400/40 bg-night/95 text-violet-100';
        item.className = `px-4 py-2.5 rounded-2xl border text-xs sm:text-sm font-medium shadow-armorSm backdrop-blur-md transition-all duration-200 ${badgeColor}`;
        item.textContent = message;
        container.appendChild(item);
        setTimeout(() => {
          item.style.opacity = '0';
          item.style.transform = 'translateY(-6px)';
          setTimeout(() => item.remove(), 220);
        }, 2400);
      } catch (err) {}
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeUsername(raw) {
      return String(raw || '')
        .trim()
        .toLowerCase()
        .replace(/^@+/, '')
        .replace(/[^a-z0-9._]/g, '');
    }

    function usernameToAuthEmail(username) {
      return `${normalizeUsername(username)}@${AUTH_EMAIL_DOMAIN}`;
    }

    function formatTimeAgo(timestamp) {
      const ts = typeof timestamp === 'string' ? Date.parse(timestamp) : Number(timestamp || 0);
      if (!ts || Number.isNaN(ts)) return '';
      const diffSec = Math.max(1, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 60) return `${diffSec}sn`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}dk`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}sa`;
      return `${Math.floor(diffHr / 24)}g`;
    }

    function getCurrentUser() {
      if (!state.sessionUserId) return null;
      return state.profiles.find((p) => p.id === state.sessionUserId) || null;
    }

    function getUserById(userId) {
      if (!userId) return null;
      return (
        state.profiles.find((p) => p.id === userId) ||
        state.searchResults.find((p) => p.id === userId) ||
        null
      );
    }

    function isUserOnline(user) {
      if (!user) return false;
      const ts = typeof user.last_active === 'string' ? Date.parse(user.last_active) : Number(user.last_active || 0);
      if (!ts || Number.isNaN(ts)) return false;
      return Date.now() - ts < 30000;
    }

    function formatLastSeen(user) {
      if (!user) return 'Çevrimdışı';
      if (isUserOnline(user)) return 'Çevrimiçi';
      const ts = typeof user.last_active === 'string' ? Date.parse(user.last_active) : Number(user.last_active || 0);
      if (!ts || Number.isNaN(ts)) return 'Çevrimdışı';
      return `Son görülme: ${formatTimeAgo(ts)} önce`;
    }

    function getSupabaseClient() {
      if (!sbClient && typeof window.supabase !== 'undefined') {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
          },
          realtime: {
            params: { eventsPerSecond: 10 },
          },
        });
      }
      return sbClient;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        state = {
          ...JSON.parse(JSON.stringify(defaultState)),
          ...parsed,
          profiles: Array.isArray(parsed?.profiles) ? parsed.profiles : [],
          follows: Array.isArray(parsed?.follows) ? parsed.follows : [],
          notifications: Array.isArray(parsed?.notifications) ? parsed.notifications : [],
          directMessages: Array.isArray(parsed?.directMessages) ? parsed.directMessages : [],
        };
      } catch (err) {
        state = JSON.parse(JSON.stringify(defaultState));
      }
    }

    function persistAll() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            profiles: state.profiles,
            follows: state.follows,
            notifications: state.notifications,
            directMessages: state.directMessages,
            sessionUserId: state.sessionUserId,
            activeTab: state.activeTab,
            selectedChatUserId: state.selectedChatUserId,
            viewedProfileUserId: state.viewedProfileUserId,
          })
        );
      } catch (err) {}
    }

    // =========================================================================
    // 3. SUPABASE VERİ ÇEKME VE GERÇEK ZAMANLI ABONELİKLER
    // =========================================================================
    async function refreshAllDatabaseData() {
      const client = getSupabaseClient();
      if (!client || !state.sessionUserId) return;

      try {
        const [profilesRes, followsRes, notifRes, messagesRes] = await Promise.all([
          client
            .from('profiles')
            .select('id,username,display_name,bio,avatar_image,last_active,created_at')
            .order('created_at', { ascending: false })
            .limit(200),
          client
            .from('follows')
            .select('id,follower_id,following_id,created_at'),
          client
            .from('notifications')
            .select('id,user_id,actor_id,type,text,read_at,created_at')
            .eq('user_id', state.sessionUserId)
            .order('created_at', { ascending: false })
            .limit(50),
          client
            .from('direct_messages')
            .select('id,sender_id,receiver_id,body,read_at,created_at')
            .or(`sender_id.eq.${state.sessionUserId},receiver_id.eq.${state.sessionUserId}`)
            .order('created_at', { ascending: true }),
        ]);

        if (!profilesRes.error && Array.isArray(profilesRes.data)) {
          state.profiles = profilesRes.data;
        }
        if (!followsRes.error && Array.isArray(followsRes.data)) {
          state.follows = followsRes.data;
        }
        if (!notifRes.error && Array.isArray(notifRes.data)) {
          state.notifications = notifRes.data;
        }
        if (!messagesRes.error && Array.isArray(messagesRes.data)) {
          state.directMessages = messagesRes.data;
        }

        persistAll();

        if (state.selectedChatUserId) {
          await markMessagesRead(state.selectedChatUserId);
        }

        render();

        if (state.activeTab === 'messages' && state.selectedChatUserId) {
          scrollChatToBottom();
        }
      } catch (err) {}
    }

    function setupRealtimeSubscriptions() {
      const client = getSupabaseClient();
      if (!client || !state.sessionUserId) return;
      if (activeRealtimeUserId === state.sessionUserId && realtimeSubscription) return;

      const isCanvasSandbox =
        window.location.protocol === 'about:' ||
        window.location.protocol === 'blob:' ||
        window.location.protocol === 'data:' ||
        typeof window.WebSocket === 'undefined';

      if (isCanvasSandbox) return;

      try {
        if (realtimeSubscription) {
          client.removeChannel(realtimeSubscription);
          realtimeSubscription = null;
        }

        realtimeSubscription = client
          .channel(`armorgram-live-${state.sessionUserId}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            refreshAllDatabaseData();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'follows' }, () => {
            refreshAllDatabaseData();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, (payload) => {
            const row = payload.new || payload.old;
            if (row && row.user_id === state.sessionUserId) {
              refreshAllDatabaseData();
            }
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'direct_messages' }, (payload) => {
            const row = payload.new || payload.old;
            if (row && (row.sender_id === state.sessionUserId || row.receiver_id === state.sessionUserId)) {
              refreshAllDatabaseData();
            }
          })
          .subscribe();

        activeRealtimeUserId = state.sessionUserId;
        setupTypingBroadcastChannel(client);
      } catch (err) {}
    }

    function setupTypingBroadcastChannel(client) {
      if (!client || !state.sessionUserId) return;
      try {
        if (typingChannel) {
          client.removeChannel(typingChannel);
          typingChannel = null;
        }
        typingChannel = client
          .channel('armorgram-typing-global')
          .on('broadcast', { event: 'typing' }, ({ payload }) => {
            if (!payload) return;
            if (payload.senderId !== state.sessionUserId && payload.receiverId === state.sessionUserId) {
              peerIsTyping = Boolean(payload.isTyping);
              updateLiveTypingIndicator();
              clearTimeout(typingHideTimer);
              if (peerIsTyping) {
                typingHideTimer = setTimeout(() => {
                  peerIsTyping = false;
                  updateLiveTypingIndicator();
                }, 2500);
              }
            }
          })
          .subscribe();
      } catch (err) {}
    }

    function notifyTypingActivity(targetUserId) {
      if (!typingChannel || !state.sessionUserId || !targetUserId) return;
      try {
        typingChannel.send({
          type: 'broadcast',
          event: 'typing',
          payload: { senderId: state.sessionUserId, receiverId: targetUserId, isTyping: true },
        });
        clearTimeout(typingBroadcastTimer);
        typingBroadcastTimer = setTimeout(() => {
          try {
            typingChannel?.send({
              type: 'broadcast',
              event: 'typing',
              payload: { senderId: state.sessionUserId, receiverId: targetUserId, isTyping: false },
            });
          } catch (e) {}
        }, 1800);
      } catch (err) {}
    }

    function updateLiveTypingIndicator() {
      const el = document.getElementById('live-typing-indicator');
      if (!el) return;
      const show = peerIsTyping && state.selectedChatUserId && activeTypingPeerId === state.selectedChatUserId;
      el.textContent = show ? 'yazıyor...' : '';
      el.className = show ? 'text-[11px] font-semibold text-purple-300 animate-pulse' : 'hidden';
    }

    // =========================================================================
    // 4. AUTH (GİRİŞ YAP / KAYIT OL / ÇIKIŞ YAP)
    // =========================================================================
    async function handleAuthSubmit(event) {
      if (event) event.preventDefault();
      const client = getSupabaseClient();
      if (!client) {
        showToast('Bağlantı hazır değil.', 'error');
        return;
      }

      try {
        const rawUsername = document.getElementById('auth-username')?.value || '';
        const rawFullName = document.getElementById('auth-fullname')?.value || '';
        const password = document.getElementById('auth-password')?.value || '';
        const username = normalizeUsername(rawUsername);
        const fullName = rawFullName.trim();

        if (!username || username.length < 3) {
          showToast('Kullanıcı adı en az 3 karakter olmalı (a-z, 0-9, ., _).', 'error');
          return;
        }
        if (!password || password.length < 6) {
          showToast('Şifre en az 6 karakter olmalı.', 'error');
          return;
        }

        const authEmail = usernameToAuthEmail(username);

        if (authMode === 'register') {
          if (!fullName) {
            showToast('Lütfen Ad Soyad gir.', 'error');
            return;
          }

          const { data: existing } = await client
            .from('profiles')
            .select('id')
            .ilike('username', username)
            .maybeSingle();

          if (existing) {
            showToast('Bu kullanıcı adı zaten alınmış.', 'error');
            return;
          }

          const { data: signUpData, error: signUpError } = await client.auth.signUp({
            email: authEmail,
            password,
            options: {
              data: { username, display_name: fullName },
            },
          });

          if (signUpError) {
            showToast(
              signUpError.message.toLowerCase().includes('already')
                ? 'Bu kullanıcı adı zaten kayıtlı.'
                : signUpError.message,
              'error'
            );
            return;
          }

          let userId = signUpData?.user?.id || null;
          if (!signUpData?.session) {
            const { data: loginData } = await client.auth.signInWithPassword({ email: authEmail, password });
            userId = loginData?.user?.id || userId;
          }

          if (userId) {
            state.sessionUserId = userId;
            await client.from('profiles').upsert(
              {
                id: userId,
                username,
                display_name: fullName,
                last_active: new Date().toISOString(),
              },
              { onConflict: 'id' }
            );
            authMode = 'login';
            state.activeTab = 'search';
            setupRealtimeSubscriptions();
            await refreshAllDatabaseData();
            showToast(`Hoş geldin, ${fullName}!`, 'success');
          }
          return;
        }

        const { data: loginData, error: loginError } = await client.auth.signInWithPassword({
          email: authEmail,
          password,
        });

        if (loginError || !loginData?.user) {
          showToast('Kullanıcı adı veya şifre hatalı.', 'error');
          return;
        }

        state.sessionUserId = loginData.user.id;
        await client
          .from('profiles')
          .update({ last_active: new Date().toISOString() })
          .eq('id', loginData.user.id);

        state.activeTab = 'messages';
        setupRealtimeSubscriptions();
        await refreshAllDatabaseData();
        showToast('Giriş yapıldı.', 'success');
      } catch (err) {
        showToast('Giriş sırasında hata oluştu.', 'error');
      }
    }

    async function handleLogout() {
      const client = getSupabaseClient();
      try {
        if (realtimeSubscription && client) {
          client.removeChannel(realtimeSubscription);
          realtimeSubscription = null;
        }
        if (typingChannel && client) {
          client.removeChannel(typingChannel);
          typingChannel = null;
        }
        activeRealtimeUserId = '';
        if (client) await client.auth.signOut();
      } catch (err) {}

      state.sessionUserId = null;
      state.selectedChatUserId = null;
      state.viewedProfileUserId = null;
      state.editProfileOpen = false;
      state.follows = [];
      state.notifications = [];
      state.directMessages = [];
      persistAll();
      render();
    }

    async function heartbeatPresence() {
      const client = getSupabaseClient();
      if (!client || !state.sessionUserId) return;
      try {
        await client
          .from('profiles')
          .update({ last_active: new Date().toISOString() })
          .eq('id', state.sessionUserId);
      } catch (err) {}
    }

    // =========================================================================
    // 5. TAKİP ETME, CANLI KULLANICI ARAMA VE BİLDİRİMLER
    // =========================================================================
    function isFollowing(targetUserId) {
      if (!state.sessionUserId || !targetUserId) return false;
      return state.follows.some(
        (f) => f.follower_id === state.sessionUserId && f.following_id === targetUserId
      );
    }

    function isFollowedBy(targetUserId) {
      if (!state.sessionUserId || !targetUserId) return false;
      return state.follows.some(
        (f) => f.follower_id === targetUserId && f.following_id === state.sessionUserId
      );
    }

    function isMutualFollow(targetUserId) {
      return isFollowing(targetUserId) && isFollowedBy(targetUserId);
    }

    async function toggleFollow(targetUserId) {
      const client = getSupabaseClient();
      const me = getCurrentUser();
      if (!client || !me || !targetUserId || me.id === targetUserId) return;

      const existing = state.follows.find(
        (f) => f.follower_id === me.id && f.following_id === targetUserId
      );

      if (existing) {
        const { error } = await client.from('follows').delete().eq('id', existing.id);
        if (error) {
          showToast('Takip bırakılamadı.', 'error');
          return;
        }
        state.follows = state.follows.filter((f) => f.id !== existing.id);
        render();
        showToast('Takipten çıkıldı.', 'info');
        await refreshAllDatabaseData();
        return;
      }

      const { data, error } = await client
        .from('follows')
        .insert({ follower_id: me.id, following_id: targetUserId })
        .select('id,follower_id,following_id,created_at')
        .single();

      if (error) {
        showToast('Takip edilemedi.', 'error');
        return;
      }

      if (data) state.follows.push(data);

      // Karşı tarafa takip bildirimi gönder
      await client.from('notifications').insert({
        user_id: targetUserId,
        actor_id: me.id,
        type: 'follow',
        text: `@${me.username} seni takip etmeye başladı.`,
      });

      render();
      showToast('Takip edildi!', 'success');
      await refreshAllDatabaseData();
    }

    async function executeDatabaseUserSearch(rawQuery) {
      state.searchQuery = rawQuery;
      const clean = String(rawQuery || '').trim().replace(/^@+/, '');

      if (!clean) {
        state.searchResults = [];
        state.isSearching = false;
        updateSearchResultsList();
        return;
      }

      const client = getSupabaseClient();
      if (!client) return;

      state.isSearching = true;
      updateSearchResultsList();

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(async () => {
        try {
          const pattern = `%${clean}%`;
          const { data, error } = await client
            .from('profiles')
            .select('id,username,display_name,bio,avatar_image,last_active,created_at')
            .or(`username.ilike.${pattern},display_name.ilike.${pattern}`)
            .limit(30);

          state.isSearching = false;
          if (!error && Array.isArray(data)) {
            state.searchResults = data;
            // Bulunan profilleri genel listeye de birleştir
            data.forEach((row) => {
              const idx = state.profiles.findIndex((p) => p.id === row.id);
              if (idx >= 0) state.profiles[idx] = row;
              else state.profiles.push(row);
            });
          }
          updateSearchResultsList();
        } catch (err) {
          state.isSearching = false;
          updateSearchResultsList();
        }
      }, 220);
    }

    async function markAllNotificationsRead() {
      const client = getSupabaseClient();
      const me = getCurrentUser();
      if (!client || !me) return;

      const unreadIds = state.notifications.filter((n) => !n.read_at).map((n) => n.id);
      if (!unreadIds.length) return;

      const nowIso = new Date().toISOString();
      state.notifications.forEach((n) => {
        if (unreadIds.includes(n.id)) n.read_at = nowIso;
      });
      persistAll();
      render();

      try {
        await client.from('notifications').update({ read_at: nowIso }).in('id', unreadIds);
      } catch (err) {}
    }

    // =========================================================================
    // 6. ÖZEL MESAJLAŞMA VE PROFİL DÜZENLEME
    // =========================================================================
    async function markMessagesRead(otherUserId) {
      const client = getSupabaseClient();
      const me = getCurrentUser();
      if (!client || !me || !otherUserId) return;

      const unreadIds = state.directMessages
        .filter((m) => m.sender_id === otherUserId && m.receiver_id === me.id && !m.read_at)
        .map((m) => m.id);

      if (!unreadIds.length) return;

      const nowIso = new Date().toISOString();
      state.directMessages.forEach((m) => {
        if (unreadIds.includes(m.id)) m.read_at = nowIso;
      });
      persistAll();

      try {
        await client.from('direct_messages').update({ read_at: nowIso }).in('id', unreadIds);
      } catch (err) {}
    }

    async function handleSendMessage(event) {
      event.preventDefault();
      const client = getSupabaseClient();
      const me = getCurrentUser();
      const targetId = state.selectedChatUserId;
      if (!client || !me || !targetId) return;

      const input = document.getElementById('dm-message-input');
      const body = input ? input.value.trim() : '';
      if (!body) return;

      const tempId = 'temp_' + Date.now();
      state.directMessages.push({
        id: tempId,
        sender_id: me.id,
        receiver_id: targetId,
        body,
        read_at: null,
        created_at: new Date().toISOString(),
      });

      if (input) input.value = '';
      render();
      scrollChatToBottom();

      try {
        typingChannel?.send({
          type: 'broadcast',
          event: 'typing',
          payload: { senderId: me.id, receiverId: targetId, isTyping: false },
        });

        const { data, error } = await client
          .from('direct_messages')
          .insert({ sender_id: me.id, receiver_id: targetId, body })
          .select('id,sender_id,receiver_id,body,read_at,created_at')
          .single();

        if (error || !data) {
          state.directMessages = state.directMessages.filter((m) => m.id !== tempId);
          render();
          showToast('Mesaj gönderilemedi.', 'error');
          return;
        }

        state.directMessages = state.directMessages.map((m) => (m.id === tempId ? data : m));
        persistAll();
        render();
        scrollChatToBottom();
        setTimeout(() => document.getElementById('dm-message-input')?.focus(), 20);
      } catch (err) {
        state.directMessages = state.directMessages.filter((m) => m.id !== tempId);
        render();
        showToast('Mesaj gönderilirken hata oluştu.', 'error');
      }
    }

    function scrollChatToBottom() {
      setTimeout(() => {
        const box = document.getElementById('chat-scroll-box');
        if (box) box.scrollTop = box.scrollHeight;
      }, 20);
    }

    function handleImageFileChange(inputEl, targetPreviewId) {
      const file = inputEl?.files?.[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        showToast('Görsel en fazla 3 MB olmalı.', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const preview = document.getElementById(targetPreviewId);
        if (preview) {
          preview.dataset.image = String(reader.result || '');
          preview.src = String(reader.result || '');
          preview.classList.remove('hidden');
        }
      };
      reader.readAsDataURL(file);
    }

    async function handleSaveProfile(event) {
      event.preventDefault();
      const client = getSupabaseClient();
      const me = getCurrentUser();
      if (!client || !me) return;

      const displayName = (document.getElementById('edit-display-name')?.value || '').trim();
      const bio = (document.getElementById('edit-bio')?.value || '').trim();
      const avatarData = document.getElementById('edit-avatar-preview')?.dataset?.image;

      const payload = {
        display_name: displayName || me.username,
        bio,
        last_active: new Date().toISOString(),
      };
      if (avatarData !== undefined) payload.avatar_image = avatarData;

      const { error } = await client.from('profiles').update(payload).eq('id', me.id);
      if (error) {
        showToast('Profil güncellenemedi.', 'error');
        return;
      }

      state.editProfileOpen = false;
      await refreshAllDatabaseData();
      showToast('Profil güncellendi.', 'success');
    }

        const contacts = state.profiles.filter((u) => u && u.id !== me.id && chatUserIds.has(u.id));

                      return `
                        <button
                          type="button"

                      const mine = msg.sender_id === me.id;
                      return `
                        <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                          <div class="max-w-[78%] rounded-2xl px-3.5 py-2.5 text-sm ${
                            mine
                              ? 'armor-gradient-btn text-white rounded-br-sm'
                              : 'bg-night border border-borderViolet text-violet-100 rounded-bl-sm'
                          }">
                            <p class="break-words leading-snug">${escapeHtml(msg.body)}</p>
                            <div class="mt-1 flex items-center justify-end gap-1 text-[10px] opacity-80">
                              <span>${formatTimeAgo(msg.created_at)}</span>
                              ${mine ? `<span>${msg.read_at ? '✓✓' : '✓'}</span>` : ''}
                            </div>
                          </div>
                        </div>
                      `;
                    })
                    .join('')
            }
          </div>

          <form onsubmit="handleSendMessage(event)" class="pt-2 flex items-center gap-2 shrink-0">
            <input
              id="dm-message-input"
              type="text"
              oninput="notifyTypingActivity('${escapeHtml(selectedUser.id)}')"
              placeholder="Mesaj yaz..."
              class="flex-1 px-4 py-2.5 rounded-2xl bg-night border border-borderViolet text-sm text-white placeholder-violet-300/40 focus:outline-none focus:border-purple-500"
            />
            <button
              type="submit"
              class="px-4 py-2.5 rounded-2xl armor-gradient-btn text-white text-sm font-bold shadow-armorSm cursor-pointer"
            >
              Gönder
            </button>
          </form>
        </div>
      `;
    }

    function renderProfileTab(me) {
      const targetUser = getUserById(state.viewedProfileUserId) || me;
      const isMine = targetUser.id === me.id;
      const followersCount = state.follows.filter((f) => f.following_id === targetUser.id).length;
      const followingCount = state.follows.filter((f) => f.follower_id === targetUser.id).length;

      return `
        <div class="max-w-lg mx-auto px-3 sm:px-4 py-4 space-y-4">
          <div class="rounded-3xl bg-night border border-borderViolet p-5 space-y-4 shadow-armorSm">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3.5 min-w-0">
                ${renderAvatar(targetUser, 'w-16 h-16 text-xl', true)}
                <div class="min-w-0">
                  <h2 class="text-lg font-extrabold text-white truncate">${escapeHtml(targetUser.display_name || targetUser.username)}</h2>
                  <p class="text-xs text-violet-300/75 truncate">@${escapeHtml(targetUser.username)}</p>
                  <p class="text-[11px] text-violet-300/65 mt-0.5">${escapeHtml(formatLastSeen(targetUser))}</p>
                </div>
              </div>
              ${
                isMine
                  ? `<button
                       type="button"
                       onclick="handleLogout()"
                       class="px-3 py-2 rounded-xl bg-rose-950/80 hover:bg-rose-900 border border-rose-500/40 text-rose-200 text-xs font-bold cursor-pointer"
                     >
                       Çıkış
                     </button>`
                  : ''
              }
            </div>

            ${targetUser.bio ? `<p class="text-xs sm:text-sm text-violet-100 leading-relaxed">${escapeHtml(targetUser.bio)}</p>` : ''}

            <div class="grid grid-cols-2 gap-2 text-center">
              <div class="rounded-2xl bg-obsidian/70 py-2.5 border border-white/5">
                <p class="text-sm font-extrabold text-white">${followersCount}</p>
                <p class="text-[11px] text-violet-300/70">Takipçi</p>
              </div>
              <div class="rounded-2xl bg-obsidian/70 py-2.5 border border-white/5">
                <p class="text-sm font-extrabold text-white">${followingCount}</p>
                <p class="text-[11px] text-violet-300/70">Takip</p>
              </div>
            </div>

            ${
              isMine
                ? `<button
                     type="button"
                     onclick="state.editProfileOpen=!state.editProfileOpen; render();"
                     class="w-full py-2.5 rounded-2xl bg-surface hover:bg-borderViolet/60 border border-white/10 text-xs font-bold text-white cursor-pointer"
                   >
                     Profili Düzenle
                   </button>`
                : `<div class="flex items-center gap-2">
                     <div class="flex-1">${renderFollowButton(targetUser.id)}</div>
                     <button
                       type="button"
                       onclick="state.activeTab='messages'; state.selectedChatUserId='${escapeHtml(targetUser.id)}'; markMessagesRead('${escapeHtml(targetUser.id)}'); render(); scrollChatToBottom();"
                       class="px-4 py-2 rounded-xl bg-surface hover:bg-borderViolet/60 border border-white/10 text-xs font-bold text-purple-200 cursor-pointer"
                     >
                       Mesaj At
                     </button>
                   </div>`
            }
          </div>

          ${
            isMine && state.editProfileOpen
              ? `<form onsubmit="handleSaveProfile(event)" class="rounded-3xl bg-night border border-borderViolet p-5 space-y-3">
                   <h3 class="text-sm font-extrabold text-white">Profili Düzenle</h3>
                   <div>
                     <label class="block text-xs text-violet-200 mb-1">Ad Soyad</label>
                     <input id="edit-display-name" type="text" value="${escapeHtml(me.display_name || '')}" class="w-full px-3.5 py-2 rounded-xl bg-obsidian border border-white/10 text-xs text-white" />
                   </div>
                   <div>
                     <label class="block text-xs text-violet-200 mb-1">Biyografi</label>
                     <textarea id="edit-bio" rows="2" class="w-full px-3.5 py-2.5 rounded-2xl bg-obsidian border border-white/10 text-sm text-white">${escapeHtml(me.bio || '')}</textarea>
                   </div>
                   <div>
                     <label class="block text-xs text-violet-200 mb-1">Profil Fotoğrafı</label>
                     <input type="file" accept="image/*" onchange="handleImageFileChange(this, 'edit-avatar-preview')" class="block w-full text-xs text-violet-200" />
                     <img id="edit-avatar-preview" data-image="${escapeHtml(me.avatar_image || '')}" src="${escapeHtml(me.avatar_image || '')}" alt="Önizleme" class="${me.avatar_image ? '' : 'hidden'} mt-2 w-16 h-16 rounded-full object-cover" />
                   </div>
                   <button type="submit" class="w-full py-2.5 rounded-2xl armor-gradient-btn text-white text-xs font-bold cursor-pointer">Kaydet</button>
                 </form>`
              : ''
          }
        </div>
      `;
    }

    function render() {
      try {
        const root = document.getElementById('app');
        if (!root) return;
        const me = getCurrentUser();

        if (!me) {
          root.innerHTML = renderAuthScreen();
          return;
        }

        let tabHtml = '';
        if (state.activeTab === 'search') {
          tabHtml = renderSearchTab(me);
        } else if (state.activeTab === 'notifications') {
          tabHtml = renderNotificationsTab(me);
        } else if (state.activeTab === 'profile') {
          tabHtml = renderProfileTab(me);
        } else {
          tabHtml = renderMessagesTab(me);
        }

        root.innerHTML = `
          ${renderTopBar(me)}
          <main class="flex-1 pb-20">
            ${tabHtml}
          </main>
          ${renderBottomNav(me)}
        `;

        if (state.activeTab === 'messages' && state.selectedChatUserId) {
          updateLiveTypingIndicator();
        }
      } catch (err) {
        const root = document.getElementById('app');
        if (root) {
          root.innerHTML = `
            <div class="p-6 text-center space-y-3">
              <p class="text-sm font-bold text-rose-300">Görünüm oluşturulurken bir hata oluştu.</p>
              <button type="button" onclick="location.reload()" class="px-4 py-2 rounded-xl armor-gradient-btn text-white text-xs font-bold cursor-pointer">
                Sayfayı Yenile
              </button>
            </div>
          `;
        }
      }
    }

    // =========================================================================
    // 8. BAŞLATMA VE CANLI SENKRONİZASYON
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      loadLocalState();
      render();

      const client = getSupabaseClient();
      if (client) {
        try {
          const { data } = await client.auth.getSession();
          if (data?.session?.user?.id) {
            state.sessionUserId = data.session.user.id;
            persistAll();
            render();
            setupRealtimeSubscriptions();
            await refreshAllDatabaseData();
          }
        } catch (err) {}
      }

      setInterval(async () => {
        if (!state.sessionUserId) return;
        await heartbeatPresence();
        await refreshAllDatabaseData();
      }, 4000);
    });
  </script>
</body>
</html>
