<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Armorgram</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS v2 (Realtime WebSocket desteği için) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Tailwind özel renk ve gölge yapılandırması
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            obsidian: '#06030c',
            night: '#0d0718',
            surface: '#160d26',
            borderViolet: '#2d1a4d',
          },
          boxShadow: {
            armor: '0 18px 48px -12px rgba(139, 92, 246, 0.35)',
            armorSm: '0 8px 24px -6px rgba(139, 92, 246, 0.3)',
          },
        },
      },
    };
  </script>
  <style>
    /* Genel sayfa ve dokunmatik kaydırma ayarları */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #06030c;
      color: #f5f3ff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .armor-gradient-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 55%, #c026d3 100%);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .armor-gradient-btn:hover {
      filter: brightness(1.08);
    }
    .armor-gradient-btn:active {
      transform: scale(0.97);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.25);
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-obsidian text-violet-50 min-h-screen flex flex-col">
  <!-- Ana uygulama kapsayıcısı -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Uygulama içi bildirim / toast katmanı -->
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[92%] max-w-sm pointer-events-none"></div>

  <script>
    // =========================================================================
    // 1. SABİTLER VE VERİ DEPOLAMA ANAHTARLARI
    // =========================================================================
    const STORAGE_KEY = 'armorgram_state_v1';
    const CLOUD_CONFIG_KEY = 'armorgram_supabase_cfg_v1';
    const DEFAULT_ROOM_ID = 'armorgram-main-room';
    const DEFAULT_SUPABASE_URL = 'https://zuigsqvjtgaudlqvgzdb.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'sb_publishable_w58_KL2tNI4hEwwBD4CWjg_bPx6k7PM';

    // Varsayılan uygulama durumu
    const defaultState = {
      users: [],
      posts: [],
      messages: [],
      follows: [],
      currentUserId: null,
      activeTab: 'feed', // 'feed' | 'search' | 'create' | 'messages' | 'profile'
      searchQuery: '',
      selectedChatUserId: null,
      viewedProfileUserId: null,
      settingsOpen: false,
      editProfileOpen: false,
      cloudConnected: false,
      lastSyncAt: 0,
    };

    // Supabase bağlantı ayarları (varsayılan proje bilgileri gömülüdür, Ayarlar'dan değiştirilebilir)
    let cloudConfig = {
      url: DEFAULT_SUPABASE_URL,
      anonKey: DEFAULT_SUPABASE_KEY,
      roomId: DEFAULT_ROOM_ID,
    };

    let state = JSON.parse(JSON.stringify(defaultState));
    let typingStatusMap = {};
    let typingOutTimer = null;
    let cloudPushTimer = null;
    let lastSnapshotHash = '';
    let supabaseRealtimeClient = null;
    let supabaseRealtimeChannel = null;
    let activeRealtimeKey = '';
    const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('armorgram_sync_channel') : null;

    // =========================================================================
    // 2. YARDIMCI FONKSİYONLAR (GÜVENLİK, TARİH, BİLDİRİM)
    // =========================================================================
    function showToast(message, type = 'info') {
      try {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const item = document.createElement('div');
        const badgeColor =
          type === 'error'
            ? 'border-rose-500/50 bg-rose-950/95 text-rose-100'
            : type === 'success'
            ? 'border-emerald-500/50 bg-emerald-950/95 text-emerald-100'
            : 'border-purple-400/40 bg-night/95 text-violet-100';
        item.className = `px-4 py-2.5 rounded-2xl border text-xs sm:text-sm font-medium shadow-armorSm backdrop-blur-md transition-all duration-200 ${badgeColor}`;
        item.textContent = message;
        container.appendChild(item);
        setTimeout(() => {
          item.style.opacity = '0';
          item.style.transform = 'translateY(-6px)';
          setTimeout(() => item.remove(), 220);
        }, 2600);
      } catch (err) {
        // Bildirim hatası uygulamayı durdurmamalı
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeUsername(raw) {
      return String(raw || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9._]/g, '');
    }

    function formatTimeAgo(timestamp) {
      const ts = Number(timestamp || 0);
      if (!ts) return '';
      const diffSec = Math.max(1, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 60) return `${diffSec}sn`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}dk`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}sa`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}g`;
    }

    function getCurrentUser() {
      if (!state.currentUserId) return null;
      return state.users.find((u) => u.id === state.currentUserId) || null;
    }

    function getUserById(userId) {
      if (!userId) return null;
      return state.users.find((u) => u.id === userId) || null;
    }

    function isUserOnline(user) {
      if (!user) return false;
      const last = Number(user.lastActive || 0);
      return Date.now() - last < 25000;
    }

    function formatLastSeen(user) {
      if (!user) return 'Çevrimdışı';
      if (isUserOnline(user)) return 'Çevrimiçi';
      const last = Number(user.lastActive || 0);
      if (!last) return 'Çevrimdışı';
      return `Son görülme: ${formatTimeAgo(last)} önce`;
    }

    // =========================================================================
    // 3. YEREL DEPOLAMA VE SUPABASE BULUT SENKRONİZASYONU
    // =========================================================================
    function loadCloudConfig() {
      try {
        const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          cloudConfig = {
            url: String(parsed?.url || DEFAULT_SUPABASE_URL).trim().replace(/\/rest\/v1\/?$/i, '').replace(/\/+$/, ''),
            anonKey: String(parsed?.anonKey || DEFAULT_SUPABASE_KEY).trim(),
            roomId: String(parsed?.roomId || DEFAULT_ROOM_ID).trim() || DEFAULT_ROOM_ID,
          };
        } else {
          cloudConfig = {
            url: DEFAULT_SUPABASE_URL,
            anonKey: DEFAULT_SUPABASE_KEY,
            roomId: DEFAULT_ROOM_ID,
          };
        }
      } catch (err) {
        cloudConfig = {
          url: DEFAULT_SUPABASE_URL,
          anonKey: DEFAULT_SUPABASE_KEY,
          roomId: DEFAULT_ROOM_ID,
        };
      }
    }

    function saveCloudConfig(nextCfg) {
      try {
        cloudConfig = {
          url: String(nextCfg?.url || DEFAULT_SUPABASE_URL).trim().replace(/\/rest\/v1\/?$/i, '').replace(/\/+$/, ''),
          anonKey: String(nextCfg?.anonKey || DEFAULT_SUPABASE_KEY).trim(),
          roomId: String(nextCfg?.roomId || DEFAULT_ROOM_ID).trim() || DEFAULT_ROOM_ID,
        };
        localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
      } catch (err) {
        // Depolama hatası yoksayılır
      }
    }

    function hasCloudConfigured() {
      return Boolean(cloudConfig.url && cloudConfig.anonKey);
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        state = {
          ...JSON.parse(JSON.stringify(defaultState)),
          ...parsed,
          users: Array.isArray(parsed?.users) ? parsed.users : [],
          posts: Array.isArray(parsed?.posts) ? parsed.posts : [],
          messages: Array.isArray(parsed?.messages) ? parsed.messages : [],
          follows: Array.isArray(parsed?.follows) ? parsed.follows : [],
        };
      } catch (err) {
        state = JSON.parse(JSON.stringify(defaultState));
      }
    }

    function persistAll() {
      try {
        const toSave = {
          users: state.users,
          posts: state.posts,
          messages: state.messages,
          follows: state.follows,
          currentUserId: state.currentUserId,
          activeTab: state.activeTab,
          selectedChatUserId: state.selectedChatUserId,
          viewedProfileUserId: state.viewedProfileUserId,
          lastSyncAt: state.lastSyncAt,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (err) {
        // Kota dolduğunda uygulamayı kırmamak için sessiz geç
      }
    }

    function getSnapshotHash(payload) {
      try {
        return JSON.stringify(payload || {});
      } catch (err) {
        return String(Date.now());
      }
    }

    function mergeCollectionById(localArr, remoteArr, sortDescBy = 'createdAt') {
      const map = new Map();
      (Array.isArray(localArr) ? localArr : []).forEach((item) => {
        if (item && item.id) map.set(item.id, item);
      });
      (Array.isArray(remoteArr) ? remoteArr : []).forEach((item) => {
        if (!item || !item.id) return;
        const prev = map.get(item.id);
        if (!prev) {
          map.set(item.id, item);
        } else {
          const prevTs = Number(prev.updatedAt || prev.lastActive || prev.createdAt || 0);
          const nextTs = Number(item.updatedAt || item.lastActive || item.createdAt || 0);
          map.set(item.id, nextTs >= prevTs ? { ...prev, ...item } : { ...item, ...prev });
        }
      });
      const list = Array.from(map.values());
      if (sortDescBy) {
        list.sort((a, b) => Number(b?.[sortDescBy] || 0) - Number(a?.[sortDescBy] || 0));
      }
      return list;
    }

    function mergeFollows(localFollows, remoteFollows) {
      const seen = new Set();
      const result = [];
      [...(Array.isArray(remoteFollows) ? remoteFollows : []), ...(Array.isArray(localFollows) ? localFollows : [])].forEach(
        (f) => {
          if (!f || !f.followerId || !f.followingId) return;
          const key = `${f.followerId}::${f.followingId}`;
          if (!seen.has(key)) {
            seen.add(key);
            result.push({ followerId: f.followerId, followingId: f.followingId });
          }
        }
      );
      return result;
    }

    function applyRemoteSnapshot(remotePayload) {
      if (!remotePayload || typeof remotePayload !== 'object') return;
      try {
        const beforeMsgCount = state.messages.length;
        const beforeUserCount = state.users.length;
        const beforePostCount = state.posts.length;

        state.users = mergeCollectionById(state.users, remotePayload.users, 'lastActive');
        state.posts = mergeCollectionById(state.posts, remotePayload.posts, 'createdAt');
        state.messages = mergeCollectionById(state.messages, remotePayload.messages, 'createdAt');
        state.follows = mergeFollows(state.follows, remotePayload.follows);

        if (remotePayload.typing && typeof remotePayload.typing === 'object') {
          const me = getCurrentUser();
          Object.entries(remotePayload.typing).forEach(([senderId, info]) => {
            if (me && senderId === me.id) return;
            if (info && Date.now() - Number(info.updatedAt || 0) < 4000) {
              typingStatusMap[senderId] = info;
            }
          });
        }

        const nextHash = getSnapshotHash({
          users: state.users,
          posts: state.posts,
          messages: state.messages,
          follows: state.follows,
        });

        const structureChanged =
          nextHash !== lastSnapshotHash ||
          state.messages.length !== beforeMsgCount ||
          state.users.length !== beforeUserCount ||
          state.posts.length !== beforePostCount;

        lastSnapshotHash = nextHash;
        state.lastSyncAt = Date.now();
        persistAll();

        if (state.activeTab === 'messages' && state.selectedChatUserId) {
          markMessagesRead(state.selectedChatUserId, false);
        }

        const activeEl = document.activeElement;
        const isTypingInInput =
          activeEl &&
          (activeEl.id === 'search-users-input' ||
            activeEl.id === 'dm-message-input' ||
            String(activeEl.id || '').startsWith('comment-input-'));

        if (structureChanged && !isTypingInInput) {
          render();
          if (state.activeTab === 'messages' && state.selectedChatUserId) {
            scrollChatToBottom();
          }
        } else if (state.activeTab === 'search') {
          updateSearchResultsList();
        }

        if (state.activeTab === 'messages' && state.selectedChatUserId) {
          updateLiveTypingIndicator(state.selectedChatUserId);
        }
      } catch (err) {
        // Anlık paket işleme hatası uygulamayı durdurmamalı
      }
    }

    async function pushCloudSync(immediate = false) {
      if (!hasCloudConfigured()) return;
      const runPush = async () => {
        try {
          const payload = {
            users: state.users,
            posts: state.posts,
            messages: state.messages,
            follows: state.follows,
            typing: typingStatusMap,
            updatedAt: Date.now(),
          };
          const endpoint = `${cloudConfig.url}/rest/v1/armorgram_rooms?on_conflict=room_id`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              apikey: cloudConfig.anonKey,
              Authorization: `Bearer ${cloudConfig.anonKey}`,
              'Content-Type': 'application/json',
              Prefer: 'resolution=merge-duplicates,return=minimal',
            },
            body: JSON.stringify([
              {
                room_id: cloudConfig.roomId || DEFAULT_ROOM_ID,
                payload,
                updated_at: new Date().toISOString(),
              },
            ]),
          });
          state.cloudConnected = res.ok;
          if (bc) {
            bc.postMessage({ type: 'SYNC_STATE', payload });
          }
        } catch (err) {
          state.cloudConnected = false;
        }
      };

      if (immediate) {
        clearTimeout(cloudPushTimer);
        await runPush();
      } else {
        clearTimeout(cloudPushTimer);
        cloudPushTimer = setTimeout(runPush, 350);
      }
    }

    async function pullCloudSync(notifyUser = false) {
      if (!hasCloudConfigured()) {
        if (notifyUser) {
          showToast('Bulut için Profil > Ayarlar kısmından Supabase URL ve Key gir.', 'info');
        }
        return;
      }
      try {
        const room = encodeURIComponent(cloudConfig.roomId || DEFAULT_ROOM_ID);
        const endpoint = `${cloudConfig.url}/rest/v1/armorgram_rooms?room_id=eq.${room}&select=payload,updated_at`;
        const res = await fetch(endpoint, {
          method: 'GET',
          headers: {
            apikey: cloudConfig.anonKey,
            Authorization: `Bearer ${cloudConfig.anonKey}`,
          },
        });
        if (!res.ok) {
          state.cloudConnected = false;
          if (notifyUser) showToast('Supabase verisi alınamadı.', 'error');
          return;
        }
        const rows = await res.json();
        state.cloudConnected = true;
        if (Array.isArray(rows) && rows[0]?.payload) {
          applyRemoteSnapshot(rows[0].payload);
          if (notifyUser) showToast('Bulut ile eşitlendi.', 'success');
        } else if (notifyUser) {
          showToast('Oda hazır, ilk veriler gönderiliyor.', 'info');
          await pushCloudSync(true);
        }
      } catch (err) {
        state.cloudConnected = false;
        if (notifyUser) showToast('Bağlantı hatası oluştu.', 'error');
      }
    }

    function initSupabaseRealtimeBridge() {
      if (!hasCloudConfigured() || typeof window.supabase === 'undefined') return;
      const key = `${cloudConfig.url}::${cloudConfig.anonKey}::${cloudConfig.roomId}`;
      if (key === activeRealtimeKey && supabaseRealtimeChannel) return;

      // Sandbox / Canvas ortamlarında WebSocket erişimi kısıtlıysa SecurityError üretmeden HTTP polling'e geç
      const isCanvasSandbox =
        window.location.protocol === 'about:' ||
        window.location.protocol === 'blob:' ||
        window.location.protocol === 'data:' ||
        typeof window.WebSocket === 'undefined';

      if (isCanvasSandbox) {
        return;
      }

      try {
        // Bazı sandbox iframe'lerde WebSocket kurucu fonksiyonuna erişim bile SecurityError fırlatabilir
        const testWsProbe = typeof WebSocket === 'function' ? WebSocket : null;
        if (!testWsProbe) return;

        if (supabaseRealtimeChannel && supabaseRealtimeClient) {
          supabaseRealtimeClient.removeChannel(supabaseRealtimeChannel);
        }
        supabaseRealtimeClient = window.supabase.createClient(cloudConfig.url, cloudConfig.anonKey, {
          realtime: { params: { eventsPerSecond: 10 } },
        });
        const roomId = cloudConfig.roomId || DEFAULT_ROOM_ID;
        supabaseRealtimeChannel = supabaseRealtimeClient
          .channel(`armorgram-room-${roomId}`)
          .on(
            'postgres_changes',
            {
              event: '*',
              schema: 'public',
              table: 'armorgram_rooms',
              filter: `room_id=eq.${roomId}`,
            },
            (evt) => {
              const nextPayload = evt?.new?.payload;
              if (nextPayload) {
                state.cloudConnected = true;
                applyRemoteSnapshot(nextPayload);
              }
            }
          )
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
              state.cloudConnected = true;
            }
          });
        activeRealtimeKey = key;
      } catch (err) {
        // Kısıtlı ortamlarda WebSocket SecurityError yutulur ve 2s HTTP senkronizasyonu devrede kalır
      }
    }

    // =========================================================================
    // 4. KİMLİK DOĞRULAMA, VARLIK VE ANLIK MESAJLAŞMA
    // =========================================================================
    function handleAuthSubmit(event, mode = 'login') {
      if (event) event.preventDefault();
      try {
        const rawUsername = document.getElementById('auth-username')?.value || '';
        const password = document.getElementById('auth-password')?.value || '';
        const rawDisplayName = document.getElementById('auth-displayname')?.value || '';
        const username = normalizeUsername(rawUsername);

        if (!username) {
          showToast('Geçerli bir kullanıcı adı gir.', 'error');
          return;
        }
        if (!password || password.length < 3) {
          showToast('Şifre en az 3 karakter olmalı.', 'error');
          return;
        }

        const existingUser = state.users.find((u) => normalizeUsername(u.username) === username);

        if (mode === 'register') {
          if (existingUser) {
            showToast('Bu kullanıcı adı zaten alınmış, giriş yapmayı dene.', 'error');
            return;
          }
          const newUser = {
            id: 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            username,
            displayName: (rawDisplayName || username).trim().slice(0, 32),
            password,
            bio: '',
            avatarImage: '',
            lastActive: Date.now(),
          };
          state.users.push(newUser);
          state.currentUserId = newUser.id;
          state.activeTab = 'feed';
          persistAll();
          pushCloudSync(true);
          showToast('Hesabın oluşturuldu!', 'success');
          render();
          return;
        }

        if (!existingUser) {
          showToast('Kullanıcı bulunamadı. Önce Kayıt Ol ile hesap açabilirsin.', 'error');
          return;
        }
        if (existingUser.password && existingUser.password !== password) {
          showToast('Şifre hatalı.', 'error');
          return;
        }

        existingUser.lastActive = Date.now();
        state.currentUserId = existingUser.id;
        state.activeTab = 'feed';
        persistAll();
        pushCloudSync(true);
        showToast(`Hoş geldin, ${existingUser.displayName || existingUser.username}!`, 'success');
        render();
      } catch (err) {
        showToast('Giriş/kayıt sırasında hata oluştu.', 'error');
      }
    }

    function handleLogout() {
      state.currentUserId = null;
      state.selectedChatUserId = null;
      state.viewedProfileUserId = null;
      state.settingsOpen = false;
      persistAll();
      render();
    }

    function heartbeatPresence() {
      const me = getCurrentUser();
      if (!me) return;
      me.lastActive = Date.now();
      persistAll();
      if (hasCloudConfigured()) {
        pushCloudSync(false);
      }
    }

    function notifyTypingActivity(targetUserId) {
      const me = getCurrentUser();
      if (!me || !targetUserId) return;
      typingStatusMap[me.id] = {
        toUserId: targetUserId,
        updatedAt: Date.now(),
      };
      if (bc) {
        bc.postMessage({
          type: 'TYPING_STATE',
          senderId: me.id,
          toUserId: targetUserId,
          updatedAt: Date.now(),
        });
      }
      clearTimeout(typingOutTimer);
      typingOutTimer = setTimeout(() => {
        if (typingStatusMap[me.id]) {
          typingStatusMap[me.id].updatedAt = 0;
        }
      }, 2400);
      pushCloudSync(false);
    }

    function updateLiveTypingIndicator(chatUserId) {
      const el = document.getElementById('live-typing-indicator');
      const me = getCurrentUser();
      if (!el || !me) return;
      const entry = typingStatusMap[chatUserId];
      const active = entry && entry.toUserId === me.id && Date.now() - (entry.updatedAt || 0) < 3500;
      el.textContent = active ? 'yazıyor...' : '';
      el.className = active ? 'text-[11px] font-semibold text-purple-300 animate-pulse' : 'hidden';
    }

    function markMessagesRead(otherUserId, shouldSync = true) {
      const me = getCurrentUser();
      if (!me || !otherUserId) return;
      let updated = false;
      state.messages.forEach((m) => {
        if (m.senderId === otherUserId && m.receiverId === me.id && !m.read) {
          m.read = true;
          updated = true;
        }
      });
      if (updated) {
        persistAll();
        if (shouldSync) pushCloudSync(false);
      }
    }

    function handleSendMessage(event) {
      event.preventDefault();
      try {
        const me = getCurrentUser();
        const targetId = state.selectedChatUserId;
        if (!me || !targetId) return;
        const input = document.getElementById('dm-message-input');
        const text = input ? input.value.trim() : '';
        if (!text) return;

        if (typingStatusMap[me.id]) {
          typingStatusMap[me.id].updatedAt = 0;
        }

        state.messages.push({
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          senderId: me.id,
          receiverId: targetId,
          text,
          read: false,
          createdAt: Date.now(),
        });
        me.lastActive = Date.now();
        if (input) input.value = '';
        persistAll();
        pushCloudSync(true);
        render();
        scrollChatToBottom();
        setTimeout(() => {
          const nextInput = document.getElementById('dm-message-input');
          if (nextInput) nextInput.focus();
        }, 30);
      } catch (err) {

    // 5. GÖNDERİ, BEĞENİ, YORUM, TAKİP VE PROFİL İŞLEMLERİ
    // =========================================================================
    function handleCreatePost(event) {
      event.preventDefault();
      try {
        const me = getCurrentUser();
        if (!me) return;
        const caption = (document.getElementById('post-caption')?.value || '').trim();
        const location = (document.getElementById('post-location')?.value || '').trim();
        const imageData = document.getElementById('post-image-preview')?.dataset?.image || '';

        if (!imageData && !caption) {
          showToast('Bir fotoğraf seç veya açıklama yaz.', 'error');
          return;
        }

        const newPost = {
          id: 'pst_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          authorId: me.id,
          image: imageData,
          caption,
          location,
          likes: [],
          comments: [],
          createdAt: Date.now(),
        };

        state.posts.unshift(newPost);
        me.lastActive = Date.now();
        state.activeTab = 'feed';
        persistAll();
        pushCloudSync(true);
        showToast('Gönderi paylaşıldı!', 'success');
        render();
      } catch (err) {
        showToast('Gönderi paylaşılırken hata oluştu.', 'error');
      }
    }

    function handleImageFileChange(inputEl, targetPreviewId) {
      const file = inputEl?.files?.[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        showToast('Görsel boyutu en fazla 4 MB olmalı.', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const preview = document.getElementById(targetPreviewId);
        if (preview) {
          preview.dataset.image = String(reader.result || '');
          preview.src = String(reader.result || '');
          preview.classList.remove('hidden');
        }
      };
      reader.onerror = () => {
        showToast('Fotoğraf okunamadı.', 'error');
      };
      reader.readAsDataURL(file);
    }

    function toggleLikePost(postId) {
      const me = getCurrentUser();
      if (!me) return;
      const post = state.posts.find((p) => p.id === postId);
      if (!post) return;
      post.likes = Array.isArray(post.likes) ? post.likes : [];
      const idx = post.likes.indexOf(me.id);
      if (idx >= 0) {
        post.likes.splice(idx, 1);
      } else {
        post.likes.push(me.id);
      }
      persistAll();
      pushCloudSync(false);
      render();
    }

    function handleAddComment(event, postId) {
      event.preventDefault();
      const me = getCurrentUser();
      if (!me) return;
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input ? input.value.trim() : '';
      if (!text) return;
      const post = state.posts.find((p) => p.id === postId);
      if (!post) return;
      post.comments = Array.isArray(post.comments) ? post.comments : [];
      post.comments.push({
        id: 'cmt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        authorId: me.id,
        text,
        createdAt: Date.now(),
      });
      if (input) input.value = '';
      persistAll();
      pushCloudSync(false);
      render();
    }

    function toggleFollow(targetUserId) {
      const me = getCurrentUser();
      if (!me || me.id === targetUserId) return;
      const existingIdx = state.follows.findIndex(
        (f) => f.followerId === me.id && f.followingId === targetUserId
      );
      if (existingIdx >= 0) {
        state.follows.splice(existingIdx, 1);
        showToast('Takipten çıkıldı.', 'info');
      } else {
        state.follows.push({ followerId: me.id, followingId: targetUserId });
        showToast('Takip edildi.', 'success');
      }
      persistAll();
      pushCloudSync(false);
      render();
    }

    function handleSaveProfile(event) {
      event.preventDefault();
      const me = getCurrentUser();
      if (!me) return;
      const displayName = (document.getElementById('edit-display-name')?.value || '').trim();
      const bio = (document.getElementById('edit-bio')?.value || '').trim();
      const avatarData = document.getElementById('edit-avatar-preview')?.dataset?.image;

      me.displayName = displayName || me.username;
      me.bio = bio;
      if (avatarData) {
        me.avatarImage = avatarData;
      }
      me.lastActive = Date.now();
      state.editProfileOpen = false;
      persistAll();
      pushCloudSync(true);
      showToast('Profil güncellendi.', 'success');
      render();
    }

    function handleSaveCloudSettings(event) {
      event.preventDefault();
      const url = document.getElementById('cfg-supabase-url')?.value || '';
      const anonKey = document.getElementById('cfg-supabase-key')?.value || '';
      const roomId = document.getElementById('cfg-room-id')?.value || DEFAULT_ROOM_ID;
      saveCloudConfig({ url, anonKey, roomId });
      activeRealtimeKey = '';
      initSupabaseRealtimeBridge();
      showToast('Supabase ayarları kaydedildi, canlı kanal bağlanıyor...', 'info');
      pushCloudSync(true);
      setTimeout(() => pullCloudSync(true), 300);
      render();
    }

        </div>
      `;
    }

    function renderCreateTab() {
      return `
        <div class="max-w-lg mx-auto px-3 sm:px-4 py-4">
          <form onsubmit="handleCreatePost(event)" class="rounded-3xl bg-night border border-borderViolet p-5 space-y-4 shadow-armorSm">
            <h2 class="text-base font-extrabold text-white">Yeni Gönderi Paylaş</h2>

            <div>
              <label class="block text-xs font-semibold text-violet-200 mb-1.5">Fotoğraf Seç</label>
              <input
                type="file"
                accept="image/*"
                onchange="handleImageFileChange(this, 'post-image-preview')"
                class="block w-full text-xs text-violet-200 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-500"
              />
              <img
                id="post-image-preview"
                data-image=""
                src=""
                alt="Önizleme"
                class="hidden mt-3 w-full max-h-72 object-cover rounded-2xl border border-white/10"
              />
            </div>

            <div>
              <label class="block text-xs font-semibold text-violet-200 mb-1.5">Açıklama</label>
              <textarea
                id="post-caption"
                rows="3"
                placeholder="Ne düşünüyorsun veya fotoğrafın hikayesi ne?"
                class="w-full px-4 py-2.5 rounded-2xl bg-obsidian border border-white/10 text-sm text-white placeholder-violet-300/40 focus:outline-none focus:border-purple-500"
              ></textarea>
            </div>

            <div>
              <label class="block text-xs font-semibold text-violet-200 mb-1.5">Konum (Opsiyonel)</label>
              <input
                id="post-location"
                type="text"
                placeholder="Örn: Cizre, Şırnak"
                class="w-full px-4 py-2.5 rounded-2xl bg-obsidian border border-white/10 text-sm text-white placeholder-violet-300/40 focus:outline-none focus:border-purple-500"
              />
            </div>

            <button
              type="submit"
              class="w-full py-3 rounded-2xl armor-gradient-btn text-white text-sm font-bold shadow-armorSm cursor-pointer"
            >
              Paylaş
            </button>
          </form>
        </div>
      `;
    }

    function renderMessagesTab(me) {
      const selectedUser = getUserById(state.selectedChatUserId);

      if (!selectedUser) {
        const contacts = state.users.filter((u) => u && u.id !== me.id);
        return `
          <div class="max-w-lg mx-auto px-3 sm:px-4 py-4 space-y-3">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-base font-extrabold text-white">Mesajlar</h2>
              <button
                type="button"
                onclick="pullCloudSync(true)"
                class="px-3 py-1.5 rounded-xl bg-surface hover:bg-borderViolet/60 border border-white/10 text-xs font-bold text-purple-200 cursor-pointer"
              >
                Eşitle
              </button>
            </div>

            ${
              !contacts.length
                ? `<div class="rounded-3xl bg-night border border-borderViolet p-6 text-center">
                     <p class="text-sm font-bold text-white mb-1">Henüz başka kullanıcı yok</p>
                     <p class="text-xs text-violet-300/70">Diğer cihazdan kayıt olunduğunda burada görünecek.</p>
                   </div>`
                : contacts
                    .map((u) => {
                      const thread = state.messages
                        .filter(
                          (m) =>
                            (m.senderId === me.id && m.receiverId === u.id) ||
                            (m.senderId === u.id && m.receiverId === me.id)
                        )
                        .sort((a, b) => Number(a.createdAt || 0) - Number(b.createdAt || 0));
                      const lastMsg = thread[thread.length - 1];
                      const unread = thread.filter((m) => m.senderId === u.id && !m.read).length;

                      return `
                        <button
                          type="button"
                          onclick="state.selectedChatUserId='${escapeHtml(u.id)}'; markMessagesRead('${escapeHtml(u.id)}'); render(); scrollChatToBottom();"
                          class="w-full rounded-2xl bg-night hover:bg-surface/80 border border-borderViolet p-3.5 flex items-center justify-between gap-3 text-left cursor-pointer"
                        >
                          <div class="flex items-center gap-3 min-w-0 flex-1">
                            ${renderAvatar(u, 'w-11 h-11 text-sm', true)}
                            <div class="min-w-0 flex-1">
                              <div class="flex items-center justify-between gap-2">
                                <p class="text-sm font-bold text-white truncate">${escapeHtml(u.displayName || u.username)}</p>
                                <span class="text-[11px] text-violet-300/60 shrink-0">${lastMsg ? formatTimeAgo(lastMsg.createdAt) : ''}</span>
                              </div>
                              <p class="text-xs text-violet-300/75 truncate mt-0.5">
                                ${lastMsg ? escapeHtml(lastMsg.text) : escapeHtml(formatLastSeen(u))}
                              </p>
                            </div>
                          </div>
                          ${
                            unread > 0
                              ? `<span class="min-w-[20px] h-5 px-1.5 rounded-full bg-fuchsia-600 text-white text-[11px] font-bold flex items-center justify-center shrink-0">${unread}</span>`
                              : ''
                          }
                        </button>
                      `;
                    })
                    .join('')
            }
          </div>
        `;
      }

      const conversation = state.messages
        .filter(
          (m) =>
            (m.senderId === me.id && m.receiverId === selectedUser.id) ||
            (m.senderId === selectedUser.id && m.receiverId === me.id)
        )
        .sort((a, b) => Number(a.createdAt || 0) - Number(b.createdAt || 0));

      return `
        <div class="max-w-lg mx-auto px-3 sm:px-4 py-3 flex flex-col h-[calc(100vh-7.5rem)]">
          <div class="rounded-2xl bg-night border border-borderViolet px-3.5 py-2.5 flex items-center justify-between mb-3 shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
              <button
                type="button"
                onclick="state.selectedChatUserId=null; render();"
                class="px-2.5 py-1.5 rounded-xl bg-surface hover:bg-borderViolet/60 text-xs font-bold text-violet-200 cursor-pointer"
              >
                Geri
              </button>
              ${renderAvatar(selectedUser, 'w-9 h-9 text-xs', true)}
              <div class="min-w-0">
                <p class="text-sm font-bold text-white truncate">${escapeHtml(selectedUser.displayName || selectedUser.username)}</p>
                <div class="flex items-center gap-2">
                  <span class="text-[11px] text-violet-300/70">${escapeHtml(formatLastSeen(selectedUser))}</span>
                  <span id="live-typing-indicator" class="hidden"></span>
                </div>
              </div>
            </div>
          </div>

          <div id="chat-scroll-box" class="flex-1 overflow-y-auto custom-scroll space-y-2.5 px-1 pb-2">
            ${
              !conversation.length
                ? `<div class="text-center py-10 text-xs text-violet-300/60">Henüz mesaj yok. İlk mesajı gönder!</div>`
                : conversation
                    .map((msg) => {
                      const mine = msg.senderId === me.id;
                      return `
                        <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                          <div class="max-w-[78%] rounded-2xl px-3.5 py-2.5 text-sm ${
                            mine
                              ? 'armor-gradient-btn text-white rounded-br-sm'
                              : 'bg-night border border-borderViolet text-violet-100 rounded-bl-sm'
                          }">
                            <p class="break-words leading-snug">${escapeHtml(msg.text)}</p>
                            <div class="mt-1 flex items-center justify-end gap-1 text-[10px] opacity-80">
                              <span>${formatTimeAgo(msg.createdAt)}</span>
                              ${mine ? `<span>${msg.read ? '✓✓' : '✓'}</span>` : ''}
                            </div>
                          </div>
                        </div>
                      `;
                    })
                    .join('')
            }
          </div>

          <form onsubmit="handleSendMessage(event)" class="pt-2 flex items-center gap-2 shrink-0">
            <input
              id="dm-message-input"
              type="text"
              oninput="notifyTypingActivity('${escapeHtml(selectedUser.id)}')"
              placeholder="Mesaj yaz..."
              class="flex-1 px-4 py-2.5 rounded-2xl bg-night border border-borderViolet text-sm text-white placeholder-violet-300/40 focus:outline-none focus:border-purple-500"
            />
            <button
              type="submit"
              class="px-4 py-2.5 rounded-2xl armor-gradient-btn text-white text-sm font-bold shadow-armorSm cursor-pointer"
            >
              Gönder
            </button>
          </form>
        </div>
      `;
    }

    function renderProfileTab(me) {
      const targetUser = getUserById(state.viewedProfileUserId) || me;
      const isMine = targetUser.id === me.id;
      const userPosts = state.posts.filter((p) => p.authorId === targetUser.id);
      const followersCount = state.follows.filter((f) => f.followingId === targetUser.id).length;
      const followingCount = state.follows.filter((f) => f.followerId === targetUser.id).length;
      const isFollowing = state.follows.some(
        (f) => f.followerId === me.id && f.followingId === targetUser.id
      );

      return `
        <div class="max-w-lg mx-auto px-3 sm:px-4 py-4 space-y-4">
          <div class="rounded-3xl bg-night border border-borderViolet p-5 space-y-4 shadow-armorSm">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3.5 min-w-0">
                ${renderAvatar(targetUser, 'w-16 h-16 text-xl', true)}
                <div class="min-w-0">
                  <h2 class="text-lg font-extrabold text-white truncate">${escapeHtml(targetUser.displayName || targetUser.username)}</h2>
                  <p class="text-xs text-violet-300/75 truncate">@${escapeHtml(targetUser.username)}</p>
                  <p class="text-[11px] text-violet-300/65 mt-0.5">${escapeHtml(formatLastSeen(targetUser))}</p>
                </div>
              </div>
              ${
                isMine
                  ? `<button
                       type="button"
                       onclick="state.settingsOpen=!state.settingsOpen; if(state.settingsOpen) state.editProfileOpen=false; render();"
                       class="p-2.5 rounded-2xl bg-surface hover:bg-borderViolet/60 border border-white/10 text-violet-200 cursor-pointer"
                       title="Ayarlar"
                     >
                       <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                         <circle cx="12" cy="12" r="3" />
                         <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                       </svg>
                     </button>`
                  : ''
              }
            </div>

            ${targetUser.bio ? `<p class="text-xs sm:text-sm text-violet-100 leading-relaxed">${escapeHtml(targetUser.bio)}</p>` : ''}

            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10 text-center">
              <div class="rounded-2xl bg-obsidian/70 py-2">
                <p class="text-sm font-extrabold text-white">${userPosts.length}</p>
                <p class="text-[11px] text-violet-300/70">Gönderi</p>
              </div>
              <div class="rounded-2xl bg-obsidian/70 py-2">
                <p class="text-sm font-extrabold text-white">${followersCount}</p>
                <p class="text-[11px] text-violet-300/70">Takipçi</p>
              </div>
              <div class="rounded-2xl bg-obsidian/70 py-2">
                <p class="text-sm font-extrabold text-white">${followingCount}</p>
                <p class="text-[11px] text-violet-300/70">Takip</p>
              </div>
            </div>

            ${
              isMine
                ? `<button
                     type="button"
                     onclick="state.editProfileOpen=!state.editProfileOpen; if(state.editProfileOpen) state.settingsOpen=false; render();"
                     class="w-full py-2.5 rounded-2xl bg-surface hover:bg-borderViolet/60 border border-white/10 text-xs font-bold text-white cursor-pointer"
                   >
                     Profili Düzenle
                   </button>`
                : `<div class="grid grid-cols-2 gap-2">
                     <button
                       type="button"
                       onclick="toggleFollow('${escapeHtml(targetUser.id)}')"
                       class="py-2.5 rounded-2xl text-xs font-bold cursor-pointer ${
                         isFollowing ? 'bg-surface border border-purple-500/40 text-purple-200' : 'armor-gradient-btn text-white'
                       }"
                     >
                       ${isFollowing ? 'Takip Ediliyor' : 'Takip Et'}
                     </button>
                     <button
                       type="button"
                       onclick="state.activeTab='messages'; state.selectedChatUserId='${escapeHtml(targetUser.id)}'; markMessagesRead('${escapeHtml(targetUser.id)}'); render();"
                       class="py-2.5 rounded-2xl bg-surface hover:bg-borderViolet/60 border border-white/10 text-xs font-bold text-white cursor-pointer"
                     >
                       Mesaj Gönder
                     </button>
                   </div>`
            }
          </div>

          ${
            isMine && state.editProfileOpen
              ? `<form onsubmit="handleSaveProfile(event)" class="rounded-3xl bg-night border border-borderViolet p-5 space-y-3">
                   <h3 class="text-sm font-extrabold text-white">Profili Düzenle</h3>
                   <div>
                     <label class="block text-xs text-violet-200 mb-1">Görünen Ad</label>
                     <input id="edit-display-name" type="text" value="${escapeHtml(me.displayName || '')}" class="w-full px-3.5 py-2 rounded-xl bg-obsidian border border-white/10 text-xs text-white" />
                   </div>
                   <div>
                     <label class="block text-xs text-violet-200 mb-1">Biyografi</label>
                     <textarea id="edit-bio" rows="2" class="w-full px-3.5 py-2.5 rounded-2xl bg-obsidian border border-white/10 text-sm text-white">${escapeHtml(me.bio || '')}</textarea>
                   </div>
                   <div>
                     <label class="block text-xs text-violet-200 mb-1">Profil Fotoğrafı</label>
                     <input type="file" accept="image/*" onchange="handleImageFileChange(this, 'edit-avatar-preview')" class="block w-full text-xs text-violet-200" />
                     <img id="edit-avatar-preview" data-image="${escapeHtml(me.avatarImage || '')}" src="${escapeHtml(me.avatarImage || '')}" alt="Profil önizleme" class="${me.avatarImage ? '' : 'hidden'} mt-2 w-16 h-16 rounded-full object-cover" />
                   </div>
                   <button type="submit" class="w-full py-2.5 rounded-2xl armor-gradient-btn text-white text-xs font-bold cursor-pointer">Kaydet</button>
                 </form>`
              : ''
          }

          ${
            isMine && state.settingsOpen
              ? `<div class="rounded-3xl bg-night border border-borderViolet p-5 space-y-4">
                   <h3 class="text-sm font-extrabold text-white">Supabase Bulut Bağlantısı & Hesap</h3>
                   <form onsubmit="handleSaveCloudSettings(event)" class="space-y-2.5">
                     <div>
                       <label class="block text-xs text-violet-200 mb-1">Supabase Project URL</label>
                       <input id="cfg-supabase-url" type="text" value="${escapeHtml(cloudConfig.url)}" placeholder="https://xxxx.supabase.co" class="w-full px-3.5 py-2 rounded-xl bg-obsidian border border-white/10 text-xs text-white" />
                     </div>
                     <div>
                       <label class="block text-xs text-violet-200 mb-1">Supabase Publishable / Anon Key</label>
                       <input id="cfg-supabase-key" type="password" value="${escapeHtml(cloudConfig.anonKey)}" placeholder="sb_publishable_... veya eyJ..." class="w-full px-3.5 py-2 rounded-xl bg-obsidian border border-white/10 text-xs text-white" />
                     </div>
                     <div>
                       <label class="block text-xs text-violet-200 mb-1">Oda Kodu</label>
                       <input id="cfg-room-id" type="text" value="${escapeHtml(cloudConfig.roomId)}" class="w-full px-3.5 py-2 rounded-xl bg-obsidian border border-white/10 text-xs text-white" />
                     </div>
                     <button type="submit" class="w-full py-2.5 rounded-2xl armor-gradient-btn text-white text-xs font-bold cursor-pointer">
                       Bulut Ayarını Kaydet ve Eşitle
                     </button>
                   </form>
                   <button
                     type="button"
                     onclick="handleLogout()"
                     class="w-full py-2.5 rounded-2xl bg-rose-950/80 hover:bg-rose-900 border border-rose-500/40 text-rose-200 text-xs font-bold cursor-pointer"
                   >
                     Çıkış Yap
                   </button>
                 </div>`
              : ''
          }

          <div class="grid grid-cols-3 gap-2">
            ${userPosts
              .map((p) =>
                p.image
                  ? `<div class="aspect-square rounded-2xl overflow-hidden bg-night border border-white/10">
                       <img src="${escapeHtml(p.image)}" alt="Gönderi" class="w-full h-full object-cover" onerror="this.style.display='none'" />
                     </div>`
                  : `<div class="aspect-square rounded-2xl p-2 bg-night border border-white/10 flex items-center justify-center text-center text-[11px] text-violet-200">
                       ${escapeHtml(p.caption || 'Not')}
                     </div>`
              )
              .join('')}
          </div>
        </div>
      `;
    }

    function render() {
      try {
        const root = document.getElementById('app');
        if (!root) return;
        const me = getCurrentUser();

        if (!me) {
          root.innerHTML = renderAuthScreen();
          return;
        }

        let tabHtml = '';
        if (state.activeTab === 'search') {
          tabHtml = renderSearchTab(me);
        } else if (state.activeTab === 'create') {
          tabHtml = renderCreateTab();
        } else if (state.activeTab === 'messages') {
          tabHtml = renderMessagesTab(me);
        } else if (state.activeTab === 'profile') {
          tabHtml = renderProfileTab(me);
        } else {
          tabHtml = renderFeedTab(me);
        }

        root.innerHTML = `
          ${renderTopBar(me)}
          <main class="flex-1 pb-20">
            ${tabHtml}
          </main>
          ${renderBottomNav()}
        `;
      } catch (err) {
        const root = document.getElementById('app');
        if (root) {
          root.innerHTML = `
            <div class="p-6 text-center space-y-3">
              <p class="text-sm font-bold text-rose-300">Görünüm oluşturulurken bir hata oluştu.</p>
              <button type="button" onclick="location.reload()" class="px-4 py-2 rounded-xl armor-gradient-btn text-white text-xs font-bold cursor-pointer">
                Sayfayı Yenile
              </button>
            </div>
          `;
        }
      }
    }

    // =========================================================================
    // 7. BAŞLATMA VE CANLI SENKRONİZASYON DÖNGÜSÜ
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadCloudConfig();
      loadLocalState();
      lastSnapshotHash = getSnapshotHash({
        users: state.users,
        posts: state.posts,
        messages: state.messages,
        follows: state.follows,
        typing: typingStatusMap,
      });
      render();
      heartbeatPresence();
      initSupabaseRealtimeBridge();
      pullCloudSync(false);

      if (bc) {
        bc.onmessage = (event) => {
          const data = event?.data;
          if (!data) return;
          if (data.type === 'TYPING_STATE') {
            typingStatusMap[data.senderId] = {
              toUserId: data.toUserId,
              updatedAt: data.updatedAt,
            };
            if (state.activeTab === 'messages' && state.selectedChatUserId) {
              updateLiveTypingIndicator(state.selectedChatUserId);
            }
          } else if (data.type === 'SYNC_STATE' && data.payload) {
            applyRemoteSnapshot(data.payload);
          }
        };
      }

      setInterval(() => {
        heartbeatPresence();
        pullCloudSync(false);
      }, 2000);
    });
  </script>
</body>
</html>
